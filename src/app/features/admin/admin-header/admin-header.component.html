<header class="bg-white shadow-sm z-10">
  <div class="flex items-center justify-between h-16 px-4 md:px-6">
    <!-- Left: Toggle Button & Breadcrumb -->
    <div class="flex items-center">
      <button
        (click)="toggleSidebar.emit()"
        class="text-gray-500 focus:outline-none focus:text-gray-700"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7" />
        </svg>
      </button>

      <div class="hidden md:block ml-4">
        <h1 class="text-lg font-semibold text-gray-700">{{ pageTitle }}</h1>
        <div class="text-sm text-gray-500">{{ pageSubtitle }}</div>
      </div>
    </div>

    <!-- Right: Search, Notifications, Profile -->
    <div class="flex items-center space-x-4">
      <!-- Search -->
      <div class="relative">
        <input
          type="text"
          placeholder="Search..."
          class="w-48 md:w-64 pl-10 pr-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
        >
        <div class="absolute left-3 top-2.5 text-gray-400">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>
      </div>

      <!-- Notifications -->
      <app-admin-notification-dropdown></app-admin-notification-dropdown>

      <!-- Profile Dropdown -->
      <div class="relative">
        <button class="flex items-center focus:outline-none" (click)="isDropdownOpen = !isDropdownOpen">
          <img class="h-8 w-8 rounded-full" src="https://media.licdn.com/dms/image/v2/D4E03AQH_D9aJqswZPQ/profile-displayphoto-shrink_400_400/B4EZR5YtPSGgAg-/0/1737203326415?e=1746662400&v=beta&t=D3rsyj5RduxZP_VFxa43h-FyQAnJMbAnYFNxrwsfBcI" alt="Admin user">
          <span class="ml-2 text-gray-700 hidden md:block">Admin User</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="ml-1 h-5 w-5 text-gray-500" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </button>
        <div *ngIf="isDropdownOpen" class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg z-20">
          <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Profile</a>
          <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Settings</a>
          <a href="#" (click)="logout()" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Logout</a>
        </div>
      </div>
    </div>
  </div>
</header>
