<header class="bg-white shadow-sm z-10">
  <div class="flex items-center justify-between h-16 px-4 md:px-6">
    <!-- Left: Toggle Button & Breadcrumb -->
    <div class="flex items-center">
      <button
        (click)="toggleSidebar.emit()"
        class="text-gray-500 focus:outline-none focus:text-gray-700"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7" />
        </svg>
      </button>

      <div class="hidden md:block ml-4">
        <h1 class="text-lg font-semibold text-gray-700">{{ pageTitle }}</h1>
        <div class="text-sm text-gray-500">{{ pageSubtitle }}</div>
      </div>
    </div>

    <!-- Right: Search, Notifications, Profile -->
    <div class="flex items-center space-x-4">
      <!-- Search -->
      <div class="relative">
        <input
          type="text"
          placeholder="Search..."
          class="w-48 md:w-64 pl-10 pr-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
        >
        <div class="absolute left-3 top-2.5 text-gray-400">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>
      </div>

      <!-- Notifications -->
      <app-admin-notification-dropdown></app-admin-notification-dropdown>

      <!-- Profile Dropdown -->
      <div class="relative">
        <button class="flex items-center focus:outline-none">
          <img class="h-8 w-8 rounded-full" src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?ixlib=rb-1.2.1&ixid=eyJhcHBfaWQiOjEyMDd9&auto=format&fit=facearea&facepad=2&w=256&h=256&q=80" alt="Admin user">
          <span class="ml-2 text-gray-700 hidden md:block">Admin User</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="ml-1 h-5 w-5 text-gray-500" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </button>
        <!-- Dropdown menu would go here -->
      </div>
    </div>
  </div>
</header>
