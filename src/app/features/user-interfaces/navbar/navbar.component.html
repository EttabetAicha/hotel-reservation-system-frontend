<header class="fixed w-full z-50 bg-white/90 backdrop-blur-lg border-b border-blue-100 shadow-sm">
  <nav class="container mx-auto px-4 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-2" @fadeInUp>
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
      </svg>
      <span class="text-2xl font-bold text-blue-800">VistaHaven</span>
    </div>

    <div class="hidden md:flex items-center space-x-8">
      <a href="#" class="text-blue-800 hover:text-blue-600 transition-colors">Home</a>
      <a href="#" class="text-blue-800 hover:text-blue-600 transition-colors">Hotels</a>
      <a href="#" class="text-blue-800 hover:text-blue-600 transition-colors">Deals</a>
      <a href="#" class="text-blue-800 hover:text-blue-600 transition-colors">Contact</a>
    </div>

    <div class="flex items-center space-x-4">
      <div  *ngIf="userName; else loggedOut">
        <span class="text-sm mx-5 text-blue-700">Welcome, {{ userName }}!</span>
        <button (click)="logout()" class="px-4 py-2 text-sm mx-5  bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors shadow-lg shadow-blue-200">
          Log out
        </button>
        <button *ngIf="role === 'ADMIN'" routerLink="/admin/dashboard" class="px-4 py-2  text-sm bg-cyan-600 text-white rounded-lg hover:bg-blue-700 transition-colors shadow-lg shadow-blue-200">
          Dashboard
        </button>
      </div>
      <ng-template #loggedOut>
        <button routerLink="/authentication/login" class="px-4 py-2 text-sm text-blue-700 hover:text-blue-600 transition-colors">Sign In</button>
        <button routerLink="/authentication/register" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors shadow-lg shadow-blue-200">
          Register
        </button>

      </ng-template>
    </div>
  </nav>
</header>
